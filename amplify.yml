version: 1
# Amplify Hosting build for a Gen 2 (TypeScript) backend plus a Next.js 16 SSR
# frontend. The `backend` phase deploys the Amplify backend for this branch and
# writes `amplify_outputs.json`, which the frontend build then imports — that
# file is gitignored on purpose, because it differs per environment.
#
# Prerequisite: the Amplify app needs a service role with the
# `AmplifyBackendDeployFullAccess` managed policy, otherwise the backend phase
# fails with an access-denied error from CloudFormation.
backend:
  phases:
    preBuild:
      commands:
        # The Amplify Gen 2 CLI needs Node 20.6+/22+; pin it rather than
        # inheriting whatever the build image defaults to.
        - nvm use 22 || nvm install 22
        - node --version
        # `npm install`, not `npm ci`, on purpose. Amplify's own packages carry
        # conflicting exact pins on `@aws-cdk/toolkit-lib`
        # (@aws-amplify/plugin-types pins 1.32.0 while backend-deployer wants
        # ^1.40.0), and no lockfile `npm install` produces can satisfy
        # `npm ci`'s stricter tree check — it fails with
        # "Missing: @aws-cdk/toolkit-lib@1.19.0 from lock file".
        # The committed lockfile is still honoured wherever it is consistent.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - node --version
        # Reuses the backend phase's install when the cache is warm.
        # `npm install`, not `npm ci`, on purpose. Amplify's own packages carry
        # conflicting exact pins on `@aws-cdk/toolkit-lib`
        # (@aws-amplify/plugin-types pins 1.32.0 while backend-deployer wants
        # ^1.40.0), and no lockfile `npm install` produces can satisfy
        # `npm ci`'s stricter tree check — it fails with
        # "Missing: @aws-cdk/toolkit-lib@1.19.0 from lock file".
        # The committed lockfile is still honoured wherever it is consistent.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
    build:
      commands:
        # `npm run typecheck` is `next typegen && tsc --noEmit`. The typegen
        # step is required, not optional: PageProps / LayoutProps /
        # RouteContext are globals Next generates into .next/types, which is
        # gitignored, so a bare `tsc` on a fresh checkout fails with
        # "Cannot find name 'PageProps'" on every typed route.
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
